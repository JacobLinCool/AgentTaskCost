<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Task Cost — what a context window really costs</title>
		<meta
			name="description"
			content="Interactive model of what it costs an agent to finish a fixed task, with the context-window limit as the independent variable."
		/>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%B8%3C/text%3E%3C/svg%3E" />
		<script>
			// Applied before first paint so the theme never flashes.
			try {
				const stored = localStorage.getItem("atp-theme");
				if (stored === "light" || stored === "dark") {
					document.documentElement.dataset.theme = stored;
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
